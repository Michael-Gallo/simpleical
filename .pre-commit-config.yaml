# https://pre-commit.com
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: test/test_data/calendar/valid_calendar_trailing_whitespace\.ical$
      - id: end-of-file-fixer
        exclude: test/test_data/calendar/valid_calendar_trailing_whitespace\.ical$
  - repo: local
    hooks:
      - id: go-fmt
        name: go fmt
        entry: go fmt ./...
        language: system
        types: [go]
        pass_filenames: false
      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        types: [go]
        pass_filenames: false
      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run
        language: system
        types: [go]
        pass_filenames: false
      - id: go-test-race
        name: go test (race)
        entry: go test ./... --race --count 1
        language: system
        types: [go]
        pass_filenames: false
