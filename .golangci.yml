version: "2"
run:
  tests: true
linters:
  enable:
    - err113
    - goconst
    - gosec
    - exhaustive
    - misspell
    - nakedret
    - noctx
    - nolintlint
    - revive
    - unconvert
    - unparam
    - whitespace
  settings:
    goconst:
      min-len: 2
      min-occurrences: 2
    misspell:
      locale: US
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: .*_test\.go$
        linters:
          - goconst
    paths:
      - .*\.pb\.go$
      - ^vendor(/|$)
      - ^third_party(/|$)
      - ^builtin(/|$)
      - ^examples(/|$)
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - .*\.pb\.go$
      - ^vendor(/|$)
      - ^third_party(/|$)
      - ^builtin(/|$)
      - ^examples(/|$)
